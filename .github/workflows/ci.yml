name: ci
on: { push: { branches: [main] }, pull_request: {} }
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Node 24 is the version CI runs; package.json `engines` allows 22 or later.
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm }
      - run: npm ci
      - run: npm test
      # An empty, explicit name list so the self-check's egress scan never falls back to
      # seeding (or reading) ~/.config/agentic-sdlc/egress-names.txt on the runner.
      - run: touch "${{ runner.temp }}/egress-names.txt"
      - run: npm run check
        env:
          SDLC_EGRESS_NAMES: ${{ runner.temp }}/egress-names.txt
