name: Deploy to Azure Container Apps

on:
  # A push to main deploys development, and so does a push to development, the branch a
  # deploy's trial is pushed to before its proposal is ruled on.
  push:
    branches: [main, development]

permissions: {}

jobs:
  development:
    runs-on: ubuntu-24.04
    environment: development
    concurrency: { group: deploy-development, cancel-in-progress: false }
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The identity this signs in as can change the container apps provisioning stood up and
      # push images, and nothing else.
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy
        env:
          RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
          REGISTRY: ${{ vars.REGISTRY }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: bash deploy/azure-container-apps/deploy.sh development "${GITHUB_SHA::12}"
