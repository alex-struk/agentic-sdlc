# Roles a test can act as, and how a test signs in as each on every target.
# identity: sandbox-idp means a Keycloak (or OIDC mock) container seeded with these users.
# A role a target has no way to act as (not merely one nobody has found a way to yet)
# writes { unavailable: "<reason>" } for that identity instead of credentials; the
# adapter's signIn then throws "unbound: ..." for it, so calibrate reports every
# criterion needing the persona as unbound rather than as a failure.
personas: []
# - id: public-sector-admin
#   can: [create opportunity, publish opportunity, score proposals]
#   sign_in: { sandbox-idp: { username: admin-1 }, session-route: { role: admin } }
# - id: second-staff-reviewer
#   can: [countersign an award]
#   sign_in: { sandbox-idp: { unavailable: "the old application seeds only one staff account" } }
